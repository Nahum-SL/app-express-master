<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Gestión de personas</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <!-- Navbar / Header -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top"
    >
      <div class="container-fluid px-3 px-lg-4">
        <!-- Nombre de la aplicación -->
        <a class="navbar-brand" href="/"> Navbar </a>

        <!-- Botón hamburguesa para móviles -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarPrincipal"
          aria-controls="navbarPrincipal"
          aria-expanded="false"
          aria-label="Mostrar navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenido del navbar -->
        <div class="collapse navbar-collapse" id="navbarPrincipal">
          <!-- Navegación centrada -->
          <ul class="navbar-nav mx-auto my-3 my-lg-0 gap-lg-2">
            <li class="nav-item">
              <!-- TODO: Configurar ruta de Personas -->
              <a
                class="btn btn-outline-light"
                href="/personas"
                aria-current="page"
              >
                Personas
              </a>
            </li>

            <li class="nav-item">
              <!-- TODO: Configurar ruta de Usuarios -->
              <a class="btn btn-outline-light" href="/usuarios"> Usuarios </a>
            </li>
          </ul>

          <!-- Información de sesión y cierre -->
          <div
            class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 pb-3 pb-lg-0"
          >
            <h2 id="who" class="h6 text-white mb-0"></h2>
            <button type="button" id="logout" class="btn btn-danger">
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container-fluid px-3 px-lg-4 py-4">
      <section class="card shadow-sm border-0">
        <div class="card-body p-3 p-lg-4">
          <!-- Encabezado de Personas -->
          <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
          >
            <div>
              <h1 class="h4 mb-1">Personas</h1>
              <p class="text-secondary mb-0">
                Administración y gestión de personas.
              </p>
            </div>

            <button
              type="button"
              id="nuevaPersona"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#dialogPersona"
            >
              + Nueva persona
            </button>
          </div>

          <!-- Tabla -->
          <div class="table-responsive">
            <table
              class="table table-striped table-hover table-bordered align-middle mb-0"
            >
              <thead class="table-dark">
                <tr>
                  <th scope="col">Apellidos</th>
                  <th scope="col">Nombres</th>
                  <th scope="col">Teléfono</th>
                  <th scope="col">Email</th>
                  <th scope="col">Dirección</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>

              <tbody id="cuerpoPersonas">
                <!-- El JavaScript renderiza las filas -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <!-- ZONA DE MODAL -->

    <!-- MODAL DE PERSONAS -->
    <div
      class="modal fade"
      id="dialogPersona"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="dialogTitle">Persona</h1>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <form action="" id="formPersona">
              <div class="form-field">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input
                  type="text"
                  id="apellidos"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-field">
                <label for="nombres" class="form-label">Nombres</label>
                <input type="text" id="nombres" class="form-control" required />
              </div>
              <div class="form-field">
                <label for="telefono" class="form-label">Telefono</label>
                <input
                  type="tel"
                  id="telefono"
                  class="form-control"
                  maxlength="9"
                  minlength="9"
                  pattern="\d+"
                  required
                />
              </div>
              <div class="form-field">
                <label for="email" class="form-label">Email</label>
                <input type="text" id="email" class="form-control" required />
              </div>
              <div class="form-field">
                <label for="direccion" class="form-label">Direccion</label>
                <input
                  type="text"
                  id="direccion"
                  class="form-control"
                  required
                />
              </div>

              <p class="text-danger" id="errorPersona"></p>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="submit" form="formPersona" class="btn btn-primary">
              Guardar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- JavaScript de la aplicación -->
    <script src="/js/app.js"></script>
  </body>
</html>
```
